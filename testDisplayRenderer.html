<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banco de Pruebas: DisplayRenderer</title>
    <link rel="stylesheet" href="/styles/test-display.css" />
  </head>
  <body>
    <div class="tester-container">
      <main class="tester-layout">
        <!-- Panel izquierdo: parámetros de señales -->
        <aside class="control-panel glass-card">
          <div id="tweakpane-signals"></div>
        </aside>

        <!-- Panel central: Canvas -->
        <section class="display-panel glass-card">
          <div class="display-bezel">
            <div id="canvas-host"></div>
          </div>
        </section>

        <!-- Panel derecho: controles del osciloscopio -->
        <aside class="control-panel glass-card">
          <div id="tweakpane-host"></div>
        </aside>
      </main>
    </div>

    <!-- Script de configuración -->
    <script type="module" src="/src/testDisplayRenderer.js"></script>
  </body>
</html>
